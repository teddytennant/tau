[package]
name = "tau"
version = "0.1.0"
edition = "2024"
description = "pi, twice. A coding agent with one tool."
license = "MIT"
repository = "https://github.com/teddytennant/tau"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = "3.5.2"
libc = "0.2.189"
ratatui = { version = "0.30.2", features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
unicode-width = "0.2.2"
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
